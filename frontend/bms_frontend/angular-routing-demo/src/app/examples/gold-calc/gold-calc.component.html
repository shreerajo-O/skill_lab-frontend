<div class="container">
  <h2>Gold Price Calculator</h2>

  <label for="purity">Gold Purity (Karat)</label>
  <select id="purity" [(ngModel)]="purity">
    <option [ngValue]="24">24K (99.9% Pure)</option>
    <option [ngValue]="22">22K (91.6% Standard)</option>
    <option [ngValue]="18">18K (75.0% Jewellery)</option>
  </select>

  <label for="weight">Weight (grams)</label>
  <input id="weight" type="number" [(ngModel)]="weight" min="0" step="0.1" />

  <label for="rate">Gold Rate per Gram (₹)</label>
  <input id="rate" type="number" [(ngModel)]="rate" min="0" />

  <label for="making">Making Charges (%)</label>
  <input id="making" type="number" [(ngModel)]="makingCharges" min="0" />

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e0d4b0;" />

  <h3>Price Breakdown</h3>
  <p>Base Gold Price: ₹{{ goldPrice | number:'1.2-2' }}</p>
  <p>Making Charges ({{ makingCharges }}%): ₹{{ makingCost | number:'1.2-2' }}</p>
  <p>GST (3%): ₹{{ gst | number:'1.2-2' }}</p>
  <h3>Total Price: ₹{{ totalPrice | number:'1.2-2' }}</h3>
</div>
